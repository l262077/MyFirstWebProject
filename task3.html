<!DOCTYPE html>
<html>

<head>
<title>Form</title>
</head>

<body bgcolor="lightgrey">
<h2 style ="color:red">Continental Hotel Reservation Form</h2>
<table border="3" bgcolor="lightblue" cellpadding="8">

<form>
<tr>
<td align="right"><b><label for="nametext">Name</label></b></td>
<td><input type="text" id="nametext" placeholder="Enter your name"></td>
</tr>
<tr>
<td align="right"><b><label for="email">eMail</label></b></td>
<td><input type= "email" id="email" value="info@continental.pk"></td>
</tr>
<tr>
<td align="right"><b><label for="mobile">Mobile No</label></b></td>
<td><input type="text" id="mobile" placeholder="Enter you cell number"></td>
</tr>
<tr>
<td align="right"><b><label>Arrival</abel></b></td>
<td><input type= "time"></td>
</tr>
<tr>
<td align ="right"><b><label for="dep">Departure</label></b></td>
<td><input type="text" id = "dep">
<input type="text" id="dep2"></td>
</tr>
<tr>
<td align = "right"><b>Room Type</b></td>
<td>
<input type="radio" name="room">Single
<input type="radio" name="room">Double<br>
<input type="radio" name="room">Preidential Suite
</td>
</tr>
<tr>
<td align = "right"><b>Prefrences</b></td>
<td>
<input type="checkbox">Non-Smocking<br>
<input type="checkbox">Internet<br>
<input type="checkbox">Firm Matress
</td>
</tr>

<tr>
<td align = "right"><b>Mode of Payment</b></td>
<td>
<input type="checkbox">Cash
<input type="checkbox">Check<br>
<input type="checkbox">Credit Card
<select id="cards" name="select car">
<option value=Visa>Visa</option>
<option value=Visa>MasterCard</option>
</select>
</td>
</tr>
<tr>
<td></td>
<td align = "center"><input type="submit" value="Send Data"></td>
</tr>

</form>
</table>






</body>
</html>
